<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ita's Fury" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#6e1423" />
  <title>MS Ita's Fury — Metal Slug Sinaloense</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <style>
    :root { --app-height: 100%; }
    html, body {
      margin: 0; padding: 0;
      /* Altura real visible (sin la barra de direcciones): usamos la variable
         que mide JS y, donde exista, la unidad dinámica dvh como respaldo. */
      height: var(--app-height);
      height: 100dvh;
      width: 100%;
      background: #0b0b0f; color: #ffd24a;
      font-family: 'Trebuchet MS', system-ui, sans-serif;
      overflow: hidden; position: fixed; inset: 0;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none; touch-action: none;
    }
    #wrap {
      display: flex; flex-direction: column;
      height: var(--app-height);
      height: 100dvh;
      width: 100%;
    }
    #game {
      flex: 1 1 auto; min-height: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #game canvas { touch-action: none; image-rendering: pixelated; display: block; }
    #hint {
      flex: 0 0 auto; text-align: center; padding: 6px 4px;
      font-size: 13px; color: #c9a23a; letter-spacing: .5px;
    }
    /* En pantallas chicas (móvil) ocultamos el texto de teclado para no robar alto */
    @media (max-width: 820px), (max-height: 460px) { #hint { display: none; } }

    /* Botón flotante de instalación (aparece solo si el navegador lo permite) */
    #install {
      position: fixed; right: 12px; top: 12px; z-index: 10000; display: none;
      background: #6e1423; color: #ffd24a; border: 2px solid #ffd24a;
      border-radius: 10px; padding: 8px 12px; font-weight: bold; font-size: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,.5); cursor: pointer;
    }

    /* Aviso de girar el teléfono en vertical */
    #rotate {
      position: fixed; inset: 0; display: none;
      background: #0b0b0f; color: #ffd24a; z-index: 9999;
      align-items: center; justify-content: center; text-align: center;
      font-size: 20px; padding: 24px;
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="game"></div>
    <div id="hint">Mover: ← → / A D &nbsp;·&nbsp; Apuntar: ↑ ↓ &nbsp;·&nbsp; Esquivar: ↓ en el piso &nbsp;·&nbsp; Saltar: W / Espacio &nbsp;·&nbsp; Disparar: J / Z &nbsp;·&nbsp; Granada: K &nbsp;·&nbsp; 🎮 GameSir X2</div>
  </div>

  <button id="install">⬇ Instalar app</button>
  <div id="rotate">📱↩️ Gira tu teléfono en horizontal para jugar</div>

  <script>
    // --- Altura real del viewport (arregla que la barra del navegador tape
    //     los controles en móvil). Medimos el alto VISIBLE y lo fijamos. ---
    (function () {
      const root = document.documentElement;
      const setH = () => {
        const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        root.style.setProperty('--app-height', h + 'px');
        // Reajusta el lienzo de Phaser cuando aparece/desaparece la barra.
        if (window.game && window.game.scale) window.game.scale.refresh();
      };
      setH();
      window.addEventListener('resize', setH);
      window.addEventListener('orientationchange', () => { setH(); setTimeout(setH, 250); setTimeout(setH, 600); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', setH);
      window.__setAppHeight = setH;
    })();

    // --- Instalación PWA (botón propio + service worker) ---
    let deferredPrompt = null;
    const installBtn = document.getElementById('install');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      installBtn.style.display = 'none';
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    });
    window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>

  <!-- Phaser por CDN (no requiere instalar nada) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Datos y configuración del juego -->
  <script src="src/data/config.js"></script>

  <!-- Audio (efectos + música sintetizados) -->
  <script src="src/audio/Sound.js"></script>

  <!-- Arte generado por código -->
  <script src="src/art/Pixel.js"></script>
  <script src="src/art/CharacterArt.js"></script>
  <script src="src/art/SceneryArt.js"></script>
  <script src="src/art/PickupArt.js"></script>

  <!-- Entidades -->
  <script src="src/entities/Player.js"></script>
  <script src="src/entities/Chairo.js"></script>
  <script src="src/entities/Lucky.js"></script>
  <script src="src/entities/Boss.js"></script>

  <!-- Escenas -->
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/CharacterSelectScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/EndScene.js"></script>

  <!-- Arranque -->
  <script src="src/main.js"></script>
</body>
</html>
