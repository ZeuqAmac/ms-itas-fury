<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>MS Ita's Fury — Metal Slug Sinaloense</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0b0b0f; color: #ffd24a;
      font-family: 'Trebuchet MS', system-ui, sans-serif;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    #wrap {
      display: flex; flex-direction: column;
      height: 100vh; width: 100vw;
    }
    #game {
      flex: 1 1 auto; min-height: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #game canvas { touch-action: none; image-rendering: pixelated; }
    #hint {
      flex: 0 0 auto; text-align: center; padding: 6px 4px;
      font-size: 13px; color: #c9a23a; letter-spacing: .5px;
    }
    /* En pantallas chicas (móvil) ocultamos el texto de teclado */
    @media (max-width: 820px) { #hint { display: none; } }
    /* Aviso de girar el teléfono en vertical */
    #rotate {
      position: fixed; inset: 0; display: none;
      background: #0b0b0f; color: #ffd24a; z-index: 9999;
      align-items: center; justify-content: center; text-align: center;
      font-size: 20px; padding: 24px;
    }
    @media (max-width: 900px) and (orientation: portrait) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="game"></div>
    <div id="hint">Mover: ← → / A D &nbsp;·&nbsp; Saltar: ↑ / W / Espacio &nbsp;·&nbsp; Disparar: J / Z &nbsp;·&nbsp; Granada: K</div>
  </div>
  <div id="rotate">📱↩️ Gira tu teléfono en horizontal para jugar</div>

  <!-- Phaser por CDN (no requiere instalar nada) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Datos y configuración del juego -->
  <script src="src/data/config.js"></script>

  <!-- Audio (efectos + música sintetizados) -->
  <script src="src/audio/Sound.js"></script>

  <!-- Arte generado por código -->
  <script src="src/art/Pixel.js"></script>
  <script src="src/art/CharacterArt.js"></script>
  <script src="src/art/SceneryArt.js"></script>

  <!-- Entidades -->
  <script src="src/entities/Player.js"></script>
  <script src="src/entities/Chairo.js"></script>
  <script src="src/entities/Lucky.js"></script>
  <script src="src/entities/Boss.js"></script>

  <!-- Escenas -->
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/EndScene.js"></script>

  <!-- Arranque -->
  <script src="src/main.js"></script>
</body>
</html>
